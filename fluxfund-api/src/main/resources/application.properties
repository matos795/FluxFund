spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/fluxfund_saas
spring.datasource.username=fluxfund
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

spring.web.cors.allowed-origin-patterns=http://localhost:5173


app.storage.local-root=./storage

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.security.jwt.issuer=fluxfund-api
app.security.jwt.access-token-expiration=PT1H
app.security.jwt.secret=FLUXFUND_JWT_SECRET // Use a strong secret key in production, and keep it secure (e.g., in environment variables or a secrets manager)

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.jpa.open-in-view=false