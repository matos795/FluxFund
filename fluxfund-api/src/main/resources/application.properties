spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fluxfund_restore_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234567}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.storage.local-root=${APP_STORAGE_LOCAL_ROOT:./storage-backup}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

app.security.jwt.issuer=${FLUXFUND_JWT_ISSUER:fluxfund-api}
app.security.jwt.access-token-expiration=${FLUXFUND_JWT_EXPIRATION:PT1H}
app.security.jwt.secret=${FLUXFUND_JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.security.invitation-expiration=${FLUXFUND_INVITATION_EXPIRATION:P7D}
app.security.password-reset-expiration=${FLUXFUND_PASSWORD_RESET_EXPIRATION:PT30M}

# E-mail transacional - Brevo
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.sender-name=${MAIL_SENDER_NAME:FluxFund}
app.mail.brevo-api-key=${BREVO_API_KEY:}

# Rate limiting
app.security.rate-limit.login.max-requests=${FLUXFUND_RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
app.security.rate-limit.login.window=${FLUXFUND_RATE_LIMIT_LOGIN_WINDOW:PT10M}

app.security.rate-limit.password-reset-request.max-requests=${FLUXFUND_RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX_REQUESTS:5}
app.security.rate-limit.password-reset-request.window=${FLUXFUND_RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW:PT30M}

app.security.rate-limit.password-reset-confirmation.max-requests=${FLUXFUND_RATE_LIMIT_PASSWORD_RESET_CONFIRMATION_MAX_REQUESTS:10}
app.security.rate-limit.password-reset-confirmation.window=${FLUXFUND_RATE_LIMIT_PASSWORD_RESET_CONFIRMATION_WINDOW:PT15M}

app.security.rate-limit.invitation-details.max-requests=${FLUXFUND_RATE_LIMIT_INVITATION_DETAILS_MAX_REQUESTS:30}
app.security.rate-limit.invitation-details.window=${FLUXFUND_RATE_LIMIT_INVITATION_DETAILS_WINDOW:PT10M}

app.security.rate-limit.invitation-accept.max-requests=${FLUXFUND_RATE_LIMIT_INVITATION_ACCEPT_MAX_REQUESTS:10}
app.security.rate-limit.invitation-accept.window=${FLUXFUND_RATE_LIMIT_INVITATION_ACCEPT_WINDOW:PT15M}